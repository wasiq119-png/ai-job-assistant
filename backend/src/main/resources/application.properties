spring.application.name=demo
server.port=8080

# Import environment variables from .env file if it exists
spring.config.import=optional:file:.env

# --- AI SECTION: Groq (OpenAI Compatible) ---
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.1-8b-instant

# --- DATABASE SECTION ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_job_assistant}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# --- JWT SECTION ---
jwt.secret=${JWT_SECRET}
jwt.expirationMs=86400000